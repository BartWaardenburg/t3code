name: Bench unused-code check
on:
  push:
    branches: ["bench/**"]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: "05e36746364bef7778ee9f2cc07dc2a3d4fe210b"
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - run: npm install -g pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - run: pnpm install --frozen-lockfile
        working-directory: head
      - name: Time both checks
        run: |
          nproc
          t() { local s e; s=$(date +%s.%N); (cd "$1" && pnpm exec vp run "$2" >/dev/null 2>&1); echo "rc=$?"; e=$(date +%s.%N); echo "$2 $(echo "$e - $s" | bc)" | tee -a times.txt; }
          for i in 1 2 3 4 5 6; do t base knip:check; t head fallow:check; done
          echo "--- fallow without its cache" | tee -a times.txt
          for i in 1 2 3 4 5 6; do rm -rf head/.fallow; t head fallow:check; done
          ls -a head | grep -i fallow
          { echo '```'; cat times.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
